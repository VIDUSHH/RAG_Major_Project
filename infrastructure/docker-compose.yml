services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: postmortem_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.18.0
    container_name: postmortem_neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-postmortem_neo4j_pass}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/7687 && echo ready'"]
      interval: 10s
      timeout: 5s
      retries: 3

  fastapi:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.fastapi
    container_name: postmortem_fastapi
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      - QDRANT_URL=
      - QDRANT_API_KEY=
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-postmortem_neo4j_pass}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence-transformers}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-384}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-flash-latest}
      - RERANKING_ENABLED=${RERANKING_ENABLED:-False}
      - DJANGO_INTERNAL_URL=http://django:8000
      - DATA_DIR=/data
    volumes:
      - rag_data:/data
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: postmortem_postgres
    restart: always
    profiles: ["control-plane"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postmortem_db}
      POSTGRES_USER: ${POSTGRES_USER:-postmortem_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postmortem_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postmortem_user} -d ${POSTGRES_DB:-postmortem_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.django
    container_name: postmortem_django
    restart: always
    profiles: ["control-plane"]
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - FASTAPI_INTERNAL_URL=http://fastapi:8001
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  qdrant_data:
  neo4j_data:
  rag_data:
  postgres_data:
