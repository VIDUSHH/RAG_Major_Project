version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postmortem_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postmortem_db}
      POSTGRES_USER: ${POSTGRES_USER:-postmortem_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postmortem_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postmortem_user} -d ${POSTGRES_DB:-postmortem_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: postmortem_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.8.3
    container_name: postmortem_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  neo4j:
    image: neo4j:5.18.0
    container_name: postmortem_neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-postmortem_neo4j_pass}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  django:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.django
    container_name: postmortem_django
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - FASTAPI_INTERNAL_URL=http://fastapi:8001
      - USE_POSTGRES=True
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fastapi:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.fastapi
    container_name: postmortem_fastapi
    restart: always
    ports:
      - "8001:8001"
    environment:
      - QDRANT_HOST=qdrant
      - NEO4J_HOST=neo4j
      - DJANGO_INTERNAL_URL=http://django:8000
    depends_on:
      - qdrant
      - neo4j

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
