[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no bare print statements)
]
ignore = [
    "S101",  # use of assert — acceptable in tests
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]                    # security + print ok in tests
"**/tests/**" = ["S", "T20"]                 # Django per-app test packages
"django_backend/**/migrations/**" = ["ALL"]  # ignore generated migration files

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "apps"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["venv/", "migrations/"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"